name: Create Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ZIP_NAME: ruijinen-skin-r001-corp-a.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      # プラグインのルートファイルのヘッダー「Version:」をリリースのタグ名にする
      - name: Get version from plugin file
        id: get_version
        run: |
          version="$(sed -n -E 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*/\1/p' ruijinen-skin-r001-corp-a.php | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error file=ruijinen-skin-r001-corp-a.php::Version ヘッダーが見つかりません"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 同じバージョンのリリースが既にある場合はリリース処理をスキップする
      - name: Check existing release
        id: check_release
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "::notice::バージョン $VERSION は既にリリース済みのため、リリース処理をスキップします"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          # タグだけ残っている場合（前回の失敗など）は既存タグでリリースを作成する
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: '24' # mise.toml と合わせる
          cache: npm

      - name: Install dependencies
        if: steps.check_release.outputs.exists == 'false'
        run: npm ci

      - name: Build css
        if: steps.check_release.outputs.exists == 'false'
        run: npm run build

      - name: Composer install
        if: steps.check_release.outputs.exists == 'false'
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      # 配布に必要なファイルだけを zip にまとめる（従来どおり zip 直下にファイルを配置）
      # 実行時に必要なファイル・ディレクトリを追加した場合はこのリストにも追加すること
      - name: Zip Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          zip -r "$ZIP_NAME" \
            ruijinen-skin-r001-corp-a.php \
            App \
            dist \
            languages \
            vendor \
            README.md \
            readme.txt \
            -x '*.DS_Store'

      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          TAG_EXISTS: ${{ steps.check_release.outputs.tag_exists }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > release-notes.md
          if [ "$TAG_EXISTS" = "true" ]; then
            target_args=(--verify-tag)
          else
            target_args=(--target "$TARGET_SHA")
          fi
          gh release create "$VERSION" "$ZIP_NAME" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            "${target_args[@]}"

      # main から dev への戻し PR を作成（既に開いている場合は作らない）
      - name: Create pull request from main to dev
        run: |
          existing="$(gh pr list --base dev --head main --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "::notice::main から dev への PR #$existing が既に存在します"
            exit 0
          fi
          gh pr create \
            --base dev \
            --head main \
            --title "リリース残処理：mainの内容をdevへ反映" \
            --body "Pulling main into dev"
