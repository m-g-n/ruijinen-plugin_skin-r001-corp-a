name: Create release pull requests

on:
  pull_request:
    branches:
      - dev
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  create-release-pr:
    # main からの戻し PR（リリース残処理）のマージ時はリリース PR を作らない
    if: github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # プラグインのルートファイルのヘッダー「Version:」をバージョンとして扱う
      - name: Get version from plugin file
        id: get_version
        run: |
          version="$(sed -n -E 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*/\1/p' ruijinen-skin-r001-corp-a.php | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error file=ruijinen-skin-r001-corp-a.php::Version ヘッダーが見つかりません"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create a release pull request
        uses: bakunyo/git-pr-release-action@ff3f59a20f467c0e9974fd815db563d4f26a52c9 # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_PR_RELEASE_BRANCH_PRODUCTION: main
          GIT_PR_RELEASE_BRANCH_STAGING: dev
          GIT_PR_RELEASE_LABELS: release
          PKG_VERSION: ${{ steps.get_version.outputs.version }}
          GIT_PR_RELEASE_TEMPLATE: .github/git-pr-release/.git-pr-release-template
