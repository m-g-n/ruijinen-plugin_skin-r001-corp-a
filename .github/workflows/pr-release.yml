name: Create release pull requests

on:
  pull_request:
    branches:
      - dev
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  create-release-pr:
    # main からの戻し PR（リリース残処理）のマージ時はリリース PR を作らない
    if: github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # プラグインのルートファイルのヘッダー「Version:」をバージョンとして扱う
      - name: Get version from plugin file
        id: get_version
        run: |
          version="$(sed -n -E 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*/\1/p' ruijinen-skin-r001-corp-a.php | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error file=ruijinen-skin-r001-corp-a.php::Version ヘッダーが見つかりません"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # README.md の変更履歴から該当バージョンの節（「## <バージョン>」から次の見出しまで）を取り出す
      - name: Get changelog from README
        id: get_changelog
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          changelog="$(awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^#/ { exit }
            found { print }
          ' README.md | sed -e '/./,$!d')"
          if [ -z "$changelog" ]; then
            echo "::warning file=README.md::README.md の変更履歴に「## $VERSION」が見つかりません"
            changelog="- README.md の変更履歴に $VERSION の記載がありません"
          fi
          delimiter="CHANGELOG_$(openssl rand -hex 8)"
          {
            echo "changelog<<$delimiter"
            echo "$changelog"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Create a release pull request
        uses: bakunyo/git-pr-release-action@ff3f59a20f467c0e9974fd815db563d4f26a52c9 # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_PR_RELEASE_BRANCH_PRODUCTION: main
          GIT_PR_RELEASE_BRANCH_STAGING: dev
          GIT_PR_RELEASE_LABELS: release
          PKG_VERSION: ${{ steps.get_version.outputs.version }}
          PKG_CHANGELOG: ${{ steps.get_changelog.outputs.changelog }}
          GIT_PR_RELEASE_TEMPLATE: .github/git-pr-release/.git-pr-release-template
